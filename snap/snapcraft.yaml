name: tiptoe
title: Tiptoe
adopt-info: tiptoe
base: core24
summary: A sneaky first person game about putting things back.
description: |
  Tiptoe is a first person stealth game about a cat burglar in reverse.
  Augustus Hoard has "borrowed" half the town's treasures, and you are the
  one quietly taking them home. Creep through houses at night, keep to the
  shadows, mind the creaky floors and the sleepy dog, and get out without
  anyone knowing you were there.

  - Every job is a little sandbox: doors to pick, lights to cut, a doorbell
    to ring, windows to climb through and people with their own routines
  - Capers reward clever runs and unlock new start points and gadgets
  - Leads point you at new ways in, if you want a nudge
  - Plays fully offline, with a keyboard and mouse or a controller
icon: icon.png
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/tiptoe
source-code: https://github.com/LinuxGroove/tiptoe
issues: https://github.com/LinuxGroove/tiptoe/issues

platforms:
  amd64:
  arm64:

apps:
  tiptoe:
    command: bin/tiptoe
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network

parts:
  tiptoe:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/tiptoe"
      test -f "$CRAFT_PART_INSTALL/game/tiptoe.pck"
      install -m 755 snap/local/tiptoe "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
